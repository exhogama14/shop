{% extends "layout.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}

<div class="auth-card">
    <h2>Create Account</h2>
    <form method="post">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required placeholder="Choose a username" autocomplete="username">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required placeholder="Enter your email" autocomplete="email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Create password (min. 6 chars)" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-block">Create Account</button>
    </form>
    <div class="auth-foot">
        Already have an account? <a href="/login">Log in</a>
    </div>
</div>

{% endblock %}
