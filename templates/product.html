{% extends "layout.html" %}
{% block title %}{{ product.name }}{% endblock %}
{% block content %}

<div class="product-detail-wrap">
    <div style="margin-bottom: 16px;"><a href="/" class="nav-link" style="font-weight:500;">← Back</a></div>
    <div class="product-detail-card">
        <div class="product-detail-grid">
            <div class="product-detail-image">
                {% if product.image %}
                    <img src="/static/images/{{ product.image }}" alt="{{ product.name }}">
                {% else %}
                    <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--text-light); font-size:48px; background:var(--bg);">📦</div>
                {% endif %}
            </div>
            <div class="product-detail-info">
                <h1>{{ product.name }}</h1>
                <div class="product-detail-price">${{ "%.2f"|format(product.price) }}</div>
                <p class="product-detail-desc">{{ product.description }}</p>
                <div class="product-detail-actions">
                    <form method="post" action="/cart/add/{{ product.id }}" style="flex:1;">
                        <button type="submit" class="btn" style="width:100%; padding:11px 16px; font-size:14px;">Add to Cart</button>
                    </form>
                    <a href="/" class="btn" style="padding:11px 16px; font-size:14px;">Back</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
